[workspace]
resolver = "2"
members = ["crates/tidefork-core", "crates/tidefork-render", "crates/tidefork-kindle", "crates/tidefork-desktop"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
tidefork-core = { path = "crates/tidefork-core" }
tidefork-render = { path = "crates/tidefork-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
